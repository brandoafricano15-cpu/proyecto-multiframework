<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventario público</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success mb-4">
    <div class="container">
        <span class="navbar-brand">Inventario en tiempo real</span>
        <div id="zonaSesion" class="d-flex align-items-center gap-2"></div>
    </div>
</nav>

<div class="container">

    <!-- tarjetas resumen -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-4">
            <div class="card text-center shadow-sm"><div class="card-body">
                <div class="text-muted small">Productos</div>
                <div class="fs-3 fw-bold" id="resTotal">0</div>
            </div></div>
        </div>
        <div class="col-6 col-md-4">
            <div class="card text-center shadow-sm"><div class="card-body">
                <div class="text-muted small">Unidades en stock</div>
                <div class="fs-3 fw-bold" id="resUnidades">0</div>
            </div></div>
        </div>
        <div class="col-12 col-md-4">
            <div class="card text-center shadow-sm"><div class="card-body">
                <div class="text-muted small">Stock bajo (menos de 10)</div>
                <div class="fs-3 fw-bold text-danger" id="resBajo">0</div>
            </div></div>
        </div>
    </div>

    <div id="alerta"></div>

    <!-- filtros -->
    <div class="card shadow-sm mb-3">
        <div class="card-body row g-2">
            <div class="col-md-7">
                <input type="text" id="buscar" class="form-control" placeholder="Buscar por nombre...">
            </div>
            <div class="col-md-5">
                <select id="categoria" class="form-select">
                    <option value="">Todas las categorías</option>
                </select>
            </div>
        </div>
    </div>

    <!-- tabla -->
    <div class="card shadow-sm mb-5">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Producto</th>
                        <th class="d-none d-md-table-cell">Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th style="width:190px">Descontar</th>
                    </tr>
                </thead>
                <tbody id="tabla"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- modal de login -->
<div class="modal fade" id="modalLogin" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="formLogin">
            <div class="modal-header">
                <h5 class="modal-title">Iniciar sesión</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="errorLogin" class="text-danger small mb-2"></div>
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" id="loginEmail" class="form-control" value="admin@correo.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" id="loginPass" class="form-control" required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success">Entrar</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// cambiar si el servidor de la API esta en otra ruta o puerto
const API = 'http://localhost:8081/api';

let token = sessionStorage.getItem('token');
let nombreUsuario = sessionStorage.getItem('nombreUsuario');
let temporizador;

const tabla = document.getElementById('tabla');
const modalLogin = new bootstrap.Modal(document.getElementById('modalLogin'));

function mostrarAlerta(texto, tipo = 'success') {
    const div = document.getElementById('alerta');
    div.innerHTML = `<div class="alert alert-${tipo} alert-dismissible">${texto}
        <button class="btn-close" data-bs-dismiss="alert"></button></div>`;
    setTimeout(() => div.innerHTML = '', 4000);
}

function formatoPrecio(n) {
    return '$' + Number(n).toLocaleString('es-CO');
}

function pintarSesion() {
    const zona = document.getElementById('zonaSesion');
    if (token) {
        zona.innerHTML = `<span class="text-white small">${nombreUsuario}</span>
            <button class="btn btn-sm btn-outline-light" id="btnSalir">Salir</button>`;
        document.getElementById('btnSalir').onclick = cerrarSesion;
    } else {
        zona.innerHTML = `<button class="btn btn-sm btn-light" id="btnEntrar">Iniciar sesión</button>`;
        document.getElementById('btnEntrar').onclick = () => modalLogin.show();
    }
}

async function cargarCategorias() {
    const r = await fetch(`${API}/categorias`);
    const json = await r.json();
    const select = document.getElementById('categoria');
    json.datos.forEach(c => {
        select.insertAdjacentHTML('beforeend', `<option value="${c}">${c}</option>`);
    });
}

async function cargarProductos() {
    const params = new URLSearchParams({
        buscar: document.getElementById('buscar').value,
        categoria: document.getElementById('categoria').value,
    });

    try {
        const r = await fetch(`${API}/productos?${params}`);
        const json = await r.json();
        pintarTabla(json.datos);
    } catch (e) {
        mostrarAlerta('No se pudo conectar con la API. ¿Está encendido el servidor?', 'danger');
    }
}

function pintarTabla(productos) {
    document.getElementById('resTotal').textContent = productos.length;
    document.getElementById('resUnidades').textContent = productos.reduce((a, p) => a + Number(p.stock), 0);
    document.getElementById('resBajo').textContent = productos.filter(p => p.stock < 10).length;

    if (productos.length === 0) {
        tabla.innerHTML = '<tr><td colspan="5" class="text-center py-4">No se encontraron productos</td></tr>';
        return;
    }

    tabla.innerHTML = productos.map(p => `
        <tr>
            <td>${p.nombre}</td>
            <td class="d-none d-md-table-cell">${p.categoria}</td>
            <td>${formatoPrecio(p.precio)}</td>
            <td><span class="badge ${p.stock < 10 ? 'bg-danger' : 'bg-success'}">${p.stock}</span></td>
            <td>
                <div class="input-group input-group-sm">
                    <input type="number" min="1" value="1" class="form-control" id="cant-${p.id}">
                    <button class="btn btn-outline-danger" onclick="descontar(${p.id})">Descontar</button>
                </div>
            </td>
        </tr>`).join('');
}

async function descontar(id) {
    if (!token) {
        modalLogin.show();
        return;
    }

    const cantidad = parseInt(document.getElementById('cant-' + id).value);

    const r = await fetch(`${API}/productos/descontar`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
        },
        body: JSON.stringify({ id, cantidad }),
    });
    const json = await r.json();

    if (r.status === 401) {
        cerrarSesion();
        mostrarAlerta('Tu sesión venció, inicia sesión otra vez', 'warning');
        return;
    }
    if (!r.ok) {
        mostrarAlerta(json.error, 'danger');
        return;
    }

    mostrarAlerta(`Se descontaron ${cantidad} unidades de ${json.datos.nombre}`);
    cargarProductos();
}

document.getElementById('formLogin').addEventListener('submit', async (e) => {
    e.preventDefault();
    const r = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPass').value,
        }),
    });
    const json = await r.json();

    if (!r.ok) {
        document.getElementById('errorLogin').textContent = json.error;
        return;
    }

    token = json.token;
    nombreUsuario = json.usuario;
    sessionStorage.setItem('token', token);
    sessionStorage.setItem('nombreUsuario', nombreUsuario);
    document.getElementById('errorLogin').textContent = '';
    modalLogin.hide();
    pintarSesion();
});

function cerrarSesion() {
    token = null;
    sessionStorage.clear();
    pintarSesion();
}

// filtros: esperar un poquito mientras el usuario escribe
document.getElementById('buscar').addEventListener('input', () => {
    clearTimeout(temporizador);
    temporizador = setTimeout(cargarProductos, 300);
});
document.getElementById('categoria').addEventListener('change', cargarProductos);

pintarSesion();
cargarCategorias();
cargarProductos();
</script>
</body>
</html>
